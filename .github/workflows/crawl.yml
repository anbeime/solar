name: Daily Crawl

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点运行
  workflow_dispatch:  # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run crawler
        run: pnpm crawl:inc
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Commit and push data
        run: |
          git config --local user.email "crawler@github.com"
          git config --local user.name "GitHub Crawler"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "chore: 更新爬虫数据 $(date '+%Y-%m-%d %H:%M')"
            git push origin main
          fi