name: Sync from Gitee

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GITEE_REPO: https://gitee.com/anbeime/solar.git
  GITHUB_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee Remote and Fetch
        run: |
          git remote add gitee ${{ env.GITEE_REPO }}
          git fetch gitee master:refs/remotes/gitee/master

      - name: Check if GitHub branch exists
        id: check_branch
        run: |
          if git show-ref --verify --quiet refs/heads/${{ env.GITHUB_BRANCH }}; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch GitHub branch if exists
        if: steps.check_branch.outputs.branch_exists == 'true'
        run: git fetch origin ${{ env.GITHUB_BRANCH }}

      - name: Check for Updates
        id: check_updates
        run: |
          GITEE_COMMIT=$(git rev-parse gitee/master)
          echo "Gitee master commit: $GITEE_COMMIT"

          if [ "${{ steps.check_branch.outputs.branch_exists }}" = "false" ]; then
            echo "GitHub branch does not exist, will force push"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "force_push=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          GITHUB_COMMIT=$(git rev-parse origin/${{ env.GITHUB_BRANCH }})
          echo "GitHub main commit: $GITHUB_COMMIT"

          if [ "$GITEE_COMMIT" = "$GITHUB_COMMIT" ]; then
            echo "No updates found."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates found!"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and push
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          if [ "${{ steps.check_updates.outputs.force_push }}" = "true" ]; then
            git checkout -b ${{ env.GITHUB_BRANCH }}
            git pull gitee master
            git push origin ${{ env.GITHUB_BRANCH }} --force
          else
            git config pull.rebase false
            git merge gitee/master -m "sync: merge from Gitee master"
            git push origin ${{ env.GITHUB_BRANCH }}
          fi

      - name: Sync Summary
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Synced Gitee master → GitHub main" >> "$GITHUB_STEP_SUMMARY"
