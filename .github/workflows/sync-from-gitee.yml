name: Sync from Gitee

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      gitee_branch:
        description: 'Gitee branch to sync from (default: master)'
        required: false
        default: 'master'
        type: string
      github_branch:
        description: 'GitHub branch to sync to (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

env:
  GITEE_REPO: https://gitee.com/anbeime/solar.git
  GITHUB_BRANCH: ${{ github.event.inputs.github_branch || 'main' }}
  GITEE_BRANCH: ${{ github.event.inputs.gitee_branch || 'master' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee Remote and Fetch
        run: |
          git remote add gitee ${{ env.GITEE_REPO }} || git remote set-url gitee ${{ env.GITEE_REPO }}
          git fetch gitee ${{ env.GITEE_BRANCH }}
          git fetch origin ${{ env.GITHUB_BRANCH }}

      - name: Check for Updates
        id: check_updates
        run: |
          GITEE_COMMIT=$(git rev-parse gitee/${{ env.GITEE_BRANCH }})
          GITHUB_COMMIT=$(git rev-parse origin/${{ env.GITHUB_BRANCH }} || echo "none")
          
          echo "Gitee commit: $GITEE_COMMIT"
          echo "GitHub commit: $GITHUB_COMMIT"
          
          if [ "$GITEE_COMMIT" = "$GITHUB_COMMIT" ]; then
            echo "No updates found. Repositories are in sync."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates found!"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "gitee_commit=$GITEE_COMMIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Gitee Changes
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          git config pull.rebase false
          
          # Ensure we're on the target branch
          git checkout ${{ env.GITHUB_BRANCH }}
          
          # Merge Gitee changes into local branch
          git merge gitee/${{ env.GITEE_BRANCH }} --allow-unrelated-histories -m "sync: merge updates from Gitee (${{ env.GITEE_BRANCH }})
          
          Source: ${{ env.GITEE_REPO }}
          Commit: ${{ steps.check_updates.outputs.gitee_commit }}"

      - name: Push to GitHub
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # Push with error handling
          if ! git push origin ${{ env.GITHUB_BRANCH }}; then
            echo "Push failed, attempting to pull and re-merge..."
            git pull origin ${{ env.GITHUB_BRANCH }} --no-rebase || git pull origin ${{ env.GITHUB_BRANCH }} --rebase
            git push origin ${{ env.GITHUB_BRANCH }}
          fi
          echo "Successfully synced from Gitee to GitHub!"

      - name: Create Sync Summary
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Successfully synced from Gitee to GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source:** Gitee (${{ env.GITEE_REPO }}, branch: ${{ env.GITEE_BRANCH }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** GitHub (${{ github.server_url }}/${{ github.repository }}, branch: ${{ env.GITHUB_BRANCH }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Latest Commit:** ${{ steps.check_updates.outputs.gitee_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Sync Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"

      - name: No Updates Summary
        if: steps.check_updates.outputs.has_updates == 'false'
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ No updates found. Repositories are already in sync." >> "$GITHUB_STEP_SUMMARY"
