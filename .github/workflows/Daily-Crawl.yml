name: Daily Crawl

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      
      - run: pnpm install --no-frozen-lockfile
      
      - name: Run Crawler
        run: pnpm crawl:inc
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      
      - name: Commit and Push Data
        run: |
          git config --local user.email "crawler@github.com"
          git config --local user.name "GitHub Crawler"
          # 推送data目录（包含projects.json等）
          git add data/
          # 也推送public/data（如果需要）
          git add public/data/
          if git diff --cached --quiet; then 
            echo "No new data, skip commit"
          else 
            git commit -m "chore: 更新爬虫数据 $(date '+%Y-%m-%d %H:%M')" 
            git push origin main
          fi
      
      - name: Deploy to Vercel
        if: vars.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
