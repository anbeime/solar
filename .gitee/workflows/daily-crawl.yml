name: Daily Crawl

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm crawl:inc
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: |
          git config --local user.email "crawler@github.com"
          git config --local user.name "GitHub Crawler"
          git add public/data/
          if git diff --cached --quiet; then echo "No new data"; else git commit -m "chore: 更新爬虫数据 $(date '+%Y-%m-%d %H:%M')" && git push origin master; fi
