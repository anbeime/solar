name: Sync to GitHub

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Gitee Actions"
          git config user.email "actions@gitee.com"

      - name: Push to GitHub (source files only)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token
          gh repo set-default --hostname github.com
          echo ".github/" > .syncignore
          echo ".gitee/" >> .syncignore
          echo ".env.*" >> .syncignore
          echo "*.log" >> .syncignore
          echo "node_modules/" >> .syncignore
          echo "dist/" >> .syncignore
          echo ".cache/" >> .syncignore
          echo ".next/" >> .syncignore
          echo "out/" >> .syncignore
          echo "pnpm-lock.yaml" >> .syncignore
          echo "package-lock.json" >> .syncignore
          git add -A --ignore-errors
          git reset .github/ .gitee/ .syncignore --quiet
          if ! git diff-index --quiet HEAD; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
            git commit -m "sync: update source code from Gitee ($TIMESTAMP)"
            git remote add github https://github.com/anbeime/solar.git
            git push github master:main -f && echo "Successfully synced to GitHub" || echo "Push failed"
          else
            echo "No source code changes to sync"
          fi
