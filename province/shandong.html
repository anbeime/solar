<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山东省光伏储能项目地图 - 山东太阳能发电储能分布查询</title>
  <meta name="description" content="山东省光伏储能项目分布地图，展示济南、青岛、烟台、潍坊等地光伏发电、储能项目位置、装机容量信息。">
  <meta name="keywords" content="山东光伏,山东储能,济南光伏,青岛太阳能,烟台储能项目,潍坊新能源">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.pvstorage-map.com/province/shandong.html">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; }
    .header { background: linear-gradient(135deg, #8e24aa, #4a148c); color: white; padding: 2rem; text-align: center; }
    .header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .stat-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
    .stat-card h3 { color: #666; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .stat-card .value { font-size: 1.8rem; font-weight: bold; color: #8e24aa; }
    .stat-card .unit { color: #999; font-size: 0.85rem; }
    .map-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin: 1rem 0; }
    #map { height: 500px; width: 100%; }
    .project-list { background: white; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; }
    .project-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #eee; }
    .project-info h4 { color: #333; margin-bottom: 0.3rem; }
    .project-info p { color: #666; font-size: 0.85rem; }
    .project-capacity { text-align: right; }
    .project-capacity .value { font-size: 1.2rem; font-weight: bold; color: #8e24aa; }
    .project-capacity .type { font-size: 0.8rem; color: #4caf50; }
    .breadcrumb { padding: 1rem; color: #666; }
    .breadcrumb a { color: #8e24aa; text-decoration: none; }
  </style>
</head>
<body>
  <header class="header">
    <h1>📍 山东省光伏储能项目地图</h1>
    <p>查看山东省光伏发电、储能项目分布与装机容量</p>
  </header>
  
  <div class="container">
    <div class="breadcrumb">
      <a href="/">首页</a> &gt; <a href="/province/">省份</a> &gt; 山东省
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <h3>项目总数</h3>
        <div class="value">368</div>
        <div class="unit">个</div>
      </div>
      <div class="stat-card">
        <h3>光伏装机</h3>
        <div class="value">22,150</div>
        <div class="unit">MW</div>
      </div>
      <div class="stat-card">
        <h3>储能容量</h3>
        <div class="value">6,240</div>
        <div class="unit">MWh</div>
      </div>
      <div class="stat-card">
        <h3>覆盖城市</h3>
        <div class="value">16</div>
        <div class="unit">个</div>
      </div>
    </div>
    
    <div class="map-container">
      <div id="map"></div>
    </div>
    
    <div class="project-list">
      <h2>📋 重点项目列表</h2>
      <div class="project-item">
        <div class="project-info">
          <h4>青岛海尔分布式光伏项目</h4>
          <p>青岛市黄岛区 | 2024-01</p>
        </div>
        <div class="project-capacity">
          <div class="value">520 MW</div>
          <div class="type">光伏+储能</div>
        </div>
      </div>
      <div class="project-item">
        <div class="project-info">
          <h4>济南力诺光伏产业基地</h4>
          <p>济南市长清区 | 2024-02</p>
        </div>
        <div class="project-capacity">
          <div class="value">420 MW</div>
          <div class="type">光伏</div>
        </div>
      </div>
      <div class="project-item">
        <div class="project-info">
          <h4>烟台万华化学储能项目</h4>
          <p>烟台市开发区 | 2024-03</p>
        </div>
        <div class="project-capacity">
          <div class="value">550 MWh</div>
          <div class="type">储能</div>
        </div>
      </div>
      <div class="project-item">
        <div class="project-info">
          <h4>潍坊歌尔光储充项目</h4>
          <p>潍坊市高新区 | 2024-04</p>
        </div>
        <div class="project-capacity">
          <div class="value">280 MW</div>
          <div class="type">光储充</div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const map = L.map('map').setView([36.668217, 116.985104], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    
    const projects = [
      { name: '青岛海尔项目', lat: 35.9936, lng: 120.3826, capacity: '520MW' },
      { name: '济南力诺基地', lat: 36.6512, lng: 116.9147, capacity: '420MW' },
      { name: '烟台万华储能', lat: 37.4638, lng: 121.4476, capacity: '550MWh' },
      { name: '潍坊歌尔项目', lat: 36.7069, lng: 119.1619, capacity: '280MW' }
    ];
    
    projects.forEach(p => {
      L.marker([p.lat, p.lng]).addTo(map)
        .bindPopup(`<b>${p.name}</b><br>装机: ${p.capacity}`);
    });
  </script>
</body>
</html>
