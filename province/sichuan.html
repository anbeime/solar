<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四川省光伏储能项目地图 - 四川太阳能发电储能分布查询</title>
  <meta name="description" content="四川省光伏储能项目分布地图，展示成都、绵阳、德阳、乐山等地光伏发电、储能项目位置、装机容量信息。">
  <meta name="keywords" content="四川光伏,四川储能,成都光伏,绵阳太阳能,德阳储能项目,乐山新能源">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.pvstorage-map.com/province/sichuan.html">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; }
    .header { background: linear-gradient(135deg, #00acc1, #00838f); color: white; padding: 2rem; text-align: center; }
    .header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .stat-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
    .stat-card h3 { color: #666; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .stat-card .value { font-size: 1.8rem; font-weight: bold; color: #00acc1; }
    .stat-card .unit { color: #999; font-size: 0.85rem; }
    .map-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin: 1rem 0; }
    #map { height: 500px; width: 100%; }
    .project-list { background: white; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; }
    .project-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #eee; }
    .project-info h4 { color: #333; margin-bottom: 0.3rem; }
    .project-info p { color: #666; font-size: 0.85rem; }
    .project-capacity { text-align: right; }
    .project-capacity .value { font-size: 1.2rem; font-weight: bold; color: #00acc1; }
    .project-capacity .type { font-size: 0.8rem; color: #4caf50; }
    .breadcrumb { padding: 1rem; color: #666; }
    .breadcrumb a { color: #00acc1; text-decoration: none; }
  </style>
</head>
<body>
  <header class="header">
    <h1>📍 四川省光伏储能项目地图</h1>
    <p>查看四川省光伏发电、储能项目分布与装机容量</p>
  </header>
  
  <div class="container">
    <div class="breadcrumb">
      <a href="/">首页</a> &gt; <a href="/province/">省份</a> &gt; 四川省
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <h3>项目总数</h3>
        <div class="value">256</div>
        <div class="unit">个</div>
      </div>
      <div class="stat-card">
        <h3>光伏装机</h3>
        <div class="value">11,350</div>
        <div class="unit">MW</div>
      </div>
      <div class="stat-card">
        <h3>储能容量</h3>
        <div class="value">3,420</div>
        <div class="unit">MWh</div>
      </div>
      <div class="stat-card">
        <h3>覆盖城市</h3>
        <div class="value">21</div>
        <div class="unit">个</div>
      </div>
    </div>
    
    <div class="map-container">
      <div id="map"></div>
    </div>
    
    <div class="project-list">
      <h2>📋 重点项目列表</h2>
      <div class="project-item">
        <div class="project-info">
          <h4>成都通威光伏产业基地</h4>
          <p>成都市双流区 | 2024-01</p>
        </div>
        <div class="project-capacity">
          <div class="value">680 MW</div>
          <div class="type">光伏+储能</div>
        </div>
      </div>
      <div class="project-item">
        <div class="project-info">
          <h4>绵阳京东方分布式光伏</h4>
          <p>绵阳市高新区 | 2024-02</p>
        </div>
        <div class="project-capacity">
          <div class="value">350 MW</div>
          <div class="type">光伏</div>
        </div>
      </div>
      <div class="project-item">
        <div class="project-info">
          <h4>德阳东方电机储能项目</h4>
          <p>德阳市旌阳区 | 2024-03</p>
        </div>
        <div class="project-capacity">
          <div class="value">380 MWh</div>
          <div class="type">储能</div>
        </div>
      </div>
      <div class="project-item">
        <div class="project-info">
          <h4>乐山晶科能源光伏项目</h4>
          <p>乐山市五通桥区 | 2024-04</p>
        </div>
        <div class="project-capacity">
          <div class="value">280 MW</div>
          <div class="type">光伏</div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const map = L.map('map').setView([30.572269, 104.066541], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    
    const projects = [
      { name: '成都通威基地', lat: 30.5721, lng: 103.9397, capacity: '680MW' },
      { name: '绵阳京东方', lat: 31.4675, lng: 104.6796, capacity: '350MW' },
      { name: '德阳东方电机', lat: 31.1311, lng: 104.4024, capacity: '380MWh' },
      { name: '乐山晶科能源', lat: 29.5521, lng: 103.7658, capacity: '280MW' }
    ];
    
    projects.forEach(p => {
      L.marker([p.lat, p.lng]).addTo(map)
        .bindPopup(`<b>${p.name}</b><br>装机: ${p.capacity}`);
    });
  </script>
</body>
</html>
